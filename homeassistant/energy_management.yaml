# ─── Octopus Energy ────────────────────────────────────────────────────────────
octopus_energy:
  api_key: !secret octopus_api_key
  accounts:
    - account_number: !secret octopus_account
      meters:
        - meter_serial: !secret octopus_meter_serial
          mpan: !secret octopus_mpan

# ─── Tapo P110 ─────────────────────────────────────────────────────────────────
tapo_p110:
  hosts:
    - host: !secret tapo_plug_ip
      username: !secret tapo_username
      password: !secret tapo_password
      update_interval: 30
  polling:
    enabled: true
    interval: 60

# ─── Input numbers ─────────────────────────────────────────────────────────────
input_number:
  max_charge_soc:
    name: "Max Charge SOC Target"
    min: 50
    max: 100
    step: 5
    initial: 90
    mode: slider
  min_discharge_soc:
    name: "Min Discharge SOC Target"
    min: 10
    max: 40
    step: 5
    initial: 20
  solar_diversion_threshold:
    name: "Solar Diversion Threshold (W)"
    min: 50
    max: 500
    step: 10
    initial: 100

# ─── Recorder ──────────────────────────────────────────────────────────────────
recorder:
  auto_purge: true
  purge_keep_days: 30
  exclude:
    entities:
      - sensor.is_cheap_rate
      - sensor.is_exporting

# ─── Include fragments ─────────────────────────────────────────────────────────
sensor: !include sensors.yaml
