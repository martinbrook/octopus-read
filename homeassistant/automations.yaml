# ─── Automations — Energy Management ──────────────────────────────────────────
# Entity IDs based on standard integration naming. Adjust if actual names differ.
# Check Developer Tools > States after setup to confirm entity IDs.

# ────────────────────────────────────────────────────────────────────────────────
# E7 CHEAP RATE CHARGING (00:30 - 07:30 local)
# ────────────────────────────────────────────────────────────────────────────────

# Turn Tapo ON when E7 starts AND battery below max charge target
- alias: "E7 Charging Start"
  description: "Turn on Tapo plug at E7 start if battery below max charge level"
  trigger:
    - platform: state
      entity_id: sensor.is_cheap_rate
      to: "true"
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Turn Tapo OFF when E7 ends (07:30)
- alias: "E7 Charging End"
  description: "Turn off Tapo plug when E7 window ends at 07:30"
  trigger:
    - platform: state
      entity_id: sensor.is_cheap_rate
      to: "false"
  condition:
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Turn Tapo OFF when battery reaches full during E7 (early stop)
- alias: "E7 Charging Full Stop"
  description: "Turn off Tapo when battery reaches max charge before E7 window closes"
  trigger:
    - platform: numeric_state
      entity_id: sensor.delta_battery_level
      above: 80
  condition:
    - condition: state
      entity_id: sensor.is_cheap_rate
      state: "true"
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# ────────────────────────────────────────────────────────────────────────────────
# SOLAR DIVERSION (daytime, outside E7)
# ────────────────────────────────────────────────────────────────────────────────

# Turn Tapo ON when excess solar detected AND battery below target AND NOT E7
- alias: "Solar Diversion Start"
  description: "Turn on Tapo plug for solar diversion when excess solar > 100W"
  trigger:
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      above: 100
  condition:
    - condition: state
      entity_id: sensor.is_cheap_rate
      state: "false"
    - condition: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "off"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Turn Tapo OFF when solar excess drops below threshold (hysteresis)
- alias: "Solar Diversion End"
  description: "Turn off Tapo plug when excess solar drops below 50W"
  trigger:
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      below: 50
  condition:
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
    - condition: state
      entity_id: sensor.is_cheap_rate
      state: "false"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Safety: Turn Tapo OFF when battery reaches full during solar diversion
- alias: "Solar Diversion Full Stop"
  description: "Turn off Tapo when battery full during solar diversion"
  trigger:
    - platform: numeric_state
      entity_id: sensor.delta_battery_level
      above: 80
  condition:
    - condition: state
      entity_id: sensor.is_cheap_rate
      state: "false"
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# ────────────────────────────────────────────────────────────────────────────────
# SOLAR PASS-THROUGH (battery full, excess solar powers office directly)
# ────────────────────────────────────────────────────────────────────────────────

# Turn Tapo ON when battery is full AND excess solar detected AND NOT E7
- alias: "Solar Pass-Through Start"
  description: "Turn on Tapo plug when battery is full and excess solar available to power office loads directly"
  trigger:
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      above: 50
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) >= states('input_number.max_charge_soc') | float(80) }}
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "off"
    - condition: state
      entity_id: sensor.is_cheap_rate
      state: "false"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Turn Tapo OFF when battery drops below full OR solar excess gone (NOT E7)
- alias: "Solar Pass-Through End"
  description: "Turn off Tapo plug when battery drops below max charge or solar excess disappears"
  trigger:
    - platform: numeric_state
      entity_id: sensor.delta_battery_level
      below: 80
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      below: 50
  condition:
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
    - condition: state
      entity_id: sensor.is_cheap_rate
      state: "false"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# ────────────────────────────────────────────────────────────────────────────────
# DYNAMIC AC CHARGE RATE (battery not full, excess solar sets charge speed)
# ────────────────────────────────────────────────────────────────────────────────

# Dynamic AC charge rate based on excess solar (Shelly EM)
- alias: "Dynamic AC Charge Rate"
  description: "Set EcoFlow AC charge rate proportional to excess solar from Shelly EM"
  trigger:
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      above: 30
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
  action:
    choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 1500
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [2000, states("sensor.excess_solar_watts") | int(0)] | min }}'
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 1000
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [1500, states("sensor.excess_solar_watts") | int(0)] | min }}'
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 500
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [1000, states("sensor.excess_solar_watts") | int(0)] | min }}'
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 300
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [500, states("sensor.excess_solar_watts") | int(0)] | min }}'
    default:
      sequence:
        - service: number.set_value
          target:
            entity_id: number.delta_ac_charging_power
          data:
            value: >
              '{{ [200, states("sensor.excess_solar_watts") | int(0)] | min }}'
  mode: single

# Recharge trigger: If battery is low, divert at lower excess threshold
- alias: "Low Battery Solar Recharge"
  description: "Start diverting solar to battery when SOC below min discharge and excess solar available"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.min_discharge_soc') | float(15) }}
  condition:
    - condition: numeric_state
      entity_id: sensor.excess_solar_watts
      above: 50
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "off"
    - condition: state
      entity_id: sensor.is_cheap_rate
      state: "false"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# ────────────────────────────────────────────────────────────────────────────────
# SAFETY CONTROLS
# ────────────────────────────────────────────────────────────────────────────────

# Low battery warning notification
# Replace <your_phone> with your actual mobile app device ID
- alias: "Low Battery Warning"
  description: "Send notification when battery drops below min discharge SOC"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.min_discharge_soc') | float(15) }}
  condition: []
  action:
    - service: notify.mobile_app_<your_phone>
      data:
        title: "Battery Low"
        message: "EcoFlow battery at {{ states('sensor.delta_battery_level') }}% — approaching minimum discharge level"

# Restore Tapo state if it reboots unexpectedly
- alias: "Tapo State Recovery"
  description: "Restore correct Tapo state every 15 minutes after reboot"
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition: []
  action:
    choose:
      - conditions:
          - condition: state
            entity_id: sensor.is_cheap_rate
            state: "true"
          - condition: template
            value_template: >
              {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
          - condition: state
            entity_id: switch.tapo_p110_power
            state: "off"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: switch.tapo_p110_power
      - conditions:
          - condition: state
            entity_id: sensor.is_cheap_rate
            state: "false"
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 100
          - condition: template
            value_template: >
              {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
          - condition: state
            entity_id: switch.tapo_p110_power
            state: "off"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: switch.tapo_p110_power
    default:
      sequence: []
  mode: single
