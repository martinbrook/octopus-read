# ─── Automations — Energy Management ──────────────────────────────────────────
# Entity IDs based on standard integration naming. Adjust if actual names differ.
# Check Developer Tools > States after setup to confirm entity IDs.

# ────────────────────────────────────────────────────────────────────────────────
# E7 CHEAP RATE CHARGING (01:30 - 08:30 local)
# ────────────────────────────────────────────────────────────────────────────────

# Turn Tapo ON when E7 starts AND battery below max charge target
- alias: "E7 Charging Start"
  description: "Turn on Tapo plug at E7 start if battery below max charge level"
  trigger:
    - platform: state
      entity_id: sensor.is_cheap_rate
      to: "True"
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Set max charge target at E7 start based on solar forecast (EcoFlow BMS handles charging strategy)
- alias: "E7 Smart Charge Target"
  description: "Set max_charge_soc based on solar forecast — less E7 on sunny days"
  trigger:
    - platform: state
      entity_id: sensor.is_cheap_rate
      to: "True"
  action:
    choose:
      - conditions:
          - condition: template
            value_template: "{{ states('sensor.energy_production_today_2') | float(0) > 15 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.max_charge_soc
            data:
              value: 25
          - service: persistent_notification.create
            data:
              title: "E7 Smart Charge — Sunny"
              message: "Solar forecast > 15 kWh — max charge set to 25% (solar will fill it, no need for E7)"
      - conditions:
          - condition: template
            value_template: "{{ states('sensor.energy_production_today_2') | float(0) > 8 }}"
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.max_charge_soc
            data:
              value: 50
          - service: persistent_notification.create
            data:
              title: "E7 Smart Charge — Moderate"
              message: "Solar forecast 8–15 kWh — max charge set to 50% (small E7 top-up, solar handles rest)"
      - conditions: []
        sequence:
          - service: input_number.set_value
            target:
              entity_id: input_number.max_charge_soc
            data:
              value: 80
          - service: persistent_notification.create
            data:
              title: "E7 Smart Charge — Cloudy"
              message: "Solar forecast < 8 kWh — max charge set to 80% (maximise E7, little solar expected)"
  mode: single

# Turn Tapo OFF when E7 ends (08:30)
- alias: "E7 Charging End"
  description: "Turn off Tapo plug when E7 window ends at 08:30"
  trigger:
    - platform: state
      entity_id: sensor.is_cheap_rate
      to: "False"
  condition:
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Turn Tapo OFF when battery reaches full during E7 (early stop)
- alias: "E7 Charging Full Stop"
  description: "Turn off Tapo when battery reaches max charge before E7 window closes"
  trigger:
    - platform: numeric_state
      entity_id: sensor.delta_battery_level
      above: 80
  condition:
    - condition: template
      value_template: "{{ states('sensor.is_cheap_rate') | lower == 'true' }}"
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# ────────────────────────────────────────────────────────────────────────────────
# SOLAR DIVERSION (excess solar powers Tapo — EcoFlow BMS handles charge/pass-through)
# ────────────────────────────────────────────────────────────────────────────────

# Turn Tapo ON when excess solar detected
- alias: "Solar Diversion Start"
  description: "Turn on Tapo plug when excess solar > 100W (EcoFlow BMS handles charging and pass-through)"
  trigger:
    - platform: homeassistant
    - platform: state
      entity_id: sensor.excess_solar_watts
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      above: 100
  condition:
    - condition: template
      value_template: "{{ states('sensor.excess_solar_watts') | float(0) > 100 }}"
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "off"
  action:
    - service: switch.turn_on
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# Turn Tapo OFF when solar excess drops below hysteresis threshold
- alias: "Solar Diversion End"
  description: "Turn off Tapo plug when excess solar drops below 50W"
  trigger:
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      below: 50
  condition:
    - condition: state
      entity_id: switch.tapo_p110_power
      state: "on"
  action:
    - service: switch.turn_off
      target:
        entity_id: switch.tapo_p110_power
  mode: single

# ────────────────────────────────────────────────────────────────────────────────
# DYNAMIC AC CHARGE RATE (battery not full, excess solar sets charge speed)
# ────────────────────────────────────────────────────────────────────────────────

# Dynamic AC charge rate based on excess solar (Shelly EM)
- alias: "Dynamic AC Charge Rate"
  description: "Set EcoFlow AC charge rate proportional to excess solar from Shelly EM"
  trigger:
    - platform: numeric_state
      entity_id: sensor.excess_solar_watts
      above: 30
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
  action:
    choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 1500
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [2000, states("sensor.excess_solar_watts") | int(0)] | min }}'
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 1000
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [1500, states("sensor.excess_solar_watts") | int(0)] | min }}'
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 500
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [1000, states("sensor.excess_solar_watts") | int(0)] | min }}'
      - conditions:
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 300
        sequence:
          - service: number.set_value
            target:
              entity_id: number.delta_ac_charging_power
            data:
              value: >
                '{{ [500, states("sensor.excess_solar_watts") | int(0)] | min }}'
    default:
      sequence:
        - service: number.set_value
          target:
            entity_id: number.delta_ac_charging_power
          data:
            value: >
              '{{ [200, states("sensor.excess_solar_watts") | int(0)] | min }}'
  mode: single

# ────────────────────────────────────────────────────────────────────────────────
# SAFETY CONTROLS
# ────────────────────────────────────────────────────────────────────────────────

# Low battery warning notification
# Replace <your_phone> with your actual mobile app device ID
- alias: "Low Battery Warning"
  description: "Send notification when battery drops below min discharge SOC"
  trigger:
    - platform: template
      value_template: >
        {{ states('sensor.delta_battery_level') | float(0) < states('input_number.min_discharge_soc') | float(15) }}
  condition: []
  action:
    - service: notify.mobile_app_<your_phone>
      data:
        title: "Battery Low"
        message: "EcoFlow battery at {{ states('sensor.delta_battery_level') }}% — approaching minimum discharge level"

# Restore Tapo state if it reboots unexpectedly
- alias: "Tapo State Recovery"
  description: "Restore correct Tapo state every 15 minutes after reboot"
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition: []
  action:
    choose:
      - conditions:
          - condition: template
            value_template: "{{ states('sensor.is_cheap_rate') | lower == 'true' }}"
          - condition: template
            value_template: >
              {{ states('sensor.delta_battery_level') | float(0) < states('input_number.max_charge_soc') | float(80) }}
          - condition: state
            entity_id: switch.tapo_p110_power
            state: "off"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: switch.tapo_p110_power
      - conditions:
          - condition: template
            value_template: "{{ states('sensor.is_cheap_rate') | lower == 'false' }}"
          - condition: numeric_state
            entity_id: sensor.excess_solar_watts
            above: 100
          - condition: state
            entity_id: switch.tapo_p110_power
            state: "off"
        sequence:
          - service: switch.turn_on
            target:
              entity_id: switch.tapo_p110_power
    default:
      sequence: []
  mode: single
