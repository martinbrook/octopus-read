dashboard:
  title: Energy
  icon: mdi:solar-power
  path: energy
views:
  - title: Energy
    cards:
      - type: entities
        title: Live Energy
        entities:
          - entity: sensor.sbfspot_solar_power
            name: Solar Generation
            unit: " W"
            icon: mdi:solar-power
          - entity: sensor.home_consumption_watts
            name: Home Consumption
            unit: " W"
            icon: mdi:home-circle
          - entity: sensor.excess_solar_watts
            name: Excess Solar (Export)
            unit: " W"
            icon: mdi:solar-power
          - entity: sensor.ecoflow_soc
            name: Battery SOC
            unit: "%"
            icon: mdi:battery-charging-50
          - entity: sensor.battery_charge_rate
            name: Battery Charge Rate
            unit: " W"
            icon: mdi:battery-charging
          - entity: sensor.battery_discharge_rate
            name: Battery Discharge Rate
            unit: " W"
            icon: mdi:battery
          - entity: sensor.net_grid_watts
            name: Net Grid Import
            unit: " W"
            icon: mdi:transmission-tower
          - entity: sensor.is_exporting
            name: Exporting Now
            icon: mdi:arrow-up-bold-circle

      - type: gauge
        entity: sensor.ecoflow_soc
        name: Battery SOC
        min: 0
        max: 100
        needle: true
        severity:
          red: 20
          yellow: 50
          green: 80

      - type: entities
        entities:
          - entity: sensor.divert_status
            name: Diversion Mode

      - type: entities
        title: Today's Energy (kWh)
        entities:
          - entity: sensor.solar_today_kwh
            name: Solar Produced
            icon: mdi:solar-power
          - entity: sensor.home_today_kwh
            name: Home Consumption
            icon: mdi:home-circle
          - entity: sensor.grid_export_today_kwh
            name: Grid Exported
            icon: mdi:arrow-up-bold-circle
          - entity: sensor.battery_stored_today_kwh
            name: Battery Stored
            icon: mdi:battery-charging
          - entity: sensor.self_consumption_pct
            name: Self-Consumption
            icon: mdi:percent

      - type: entities
        title: Octopus Tariff
        entities:
          - entity: sensor.octopus_energy_electricity_21M0104038_1100021680150_current_rate
            name: Current Rate
          - entity: sensor.octopus_energy_electricity_21M0104038_1100021680150_next_rate
            name: Next Rate
          - entity: sensor.is_cheap_rate
            name: E7 Active
          - entity: sensor.is_exporting
            name: Exporting Now

      - type: entities
        title: Real-Time Power
        entities:
          - entity: sensor.sbfspot_solar_power
            name: Solar
            unit: " W"
            icon: mdi:solar-power
          - entity: sensor.home_consumption_watts
            name: Home
            unit: " W"
            icon: mdi:home-circle
          - entity: sensor.net_grid_watts
            name: Grid
            unit: " W"
            icon: mdi:transmission-tower
          - entity: sensor.battery_charge_rate
            name: Battery In
            unit: " W"
            icon: mdi:battery-charging
          - entity: sensor.battery_discharge_rate
            name: Battery Out
            unit: " W"
            icon: mdi:battery
          - entity: sensor.excess_solar_watts
            name: Excess Solar
            unit: " W"
            icon: mdi:solar-power

      - type: history-graph
        title: Historical Trends
        hours_to_show: 24
        entities:
          - sensor.ecoflow_soc
          - sensor.battery_charge_rate
          - sensor.battery_discharge_rate
          - sensor.excess_solar_watts
          - sensor.net_grid_watts
          - sensor.self_consumption_pct
